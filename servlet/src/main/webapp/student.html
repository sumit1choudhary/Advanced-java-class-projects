<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Form</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card"><p class="eyebrow">POST REQUEST DEMO</p><h1>Student Information</h1><p class="muted">Submit the form to see request parameters handled by a Servlet.</p>
<form action="student" method="post">
<label for="name">Full name</label><input id="name" name="name" required>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="course">Course</label><select id="course" name="course" required><option value="">Choose a course</option><option>B.Tech CSE</option><option>BCA</option><option>MCA</option><option>B.Sc. IT</option></select>
<button type="submit">Submit details</button></form><p class="links"><a href="index.html">Back to login</a></p></main></body></html>
